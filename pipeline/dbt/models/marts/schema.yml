version: 2

models:
  - name: dim_customers
    description: One row per customer with lifetime order stats.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: fct_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: daily_revenue
    description: Revenue per day, excluding cancelled orders.
    columns:
      - name: order_date
        data_tests: [unique, not_null]
